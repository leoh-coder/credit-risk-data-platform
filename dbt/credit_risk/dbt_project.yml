name: credit_risk
version: "0.1.0"
config-version: 2
profile: credit_risk

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Default: 90+ days past due within the first 12 installments.
  pd_window_installments: 12
  pd_default_dpd: 90
  # Open Finance history shared at onboarding; anything on/after the application date is leakage.
  open_finance_history_days: 90

  # Data-quality budgets (percent of rows). Above *_warn the build warns; above *_error it fails.
  dq_unknown_customer_warn_pct: 0
  dq_unknown_customer_error_pct: 5
  dq_incomplete_window_warn_pct: 10
  dq_incomplete_window_error_pct: 30
  dq_quarantine_warn_pct: 5
  dq_quarantine_error_pct: 10

data_tests:
  credit_risk:
    # Keep the offending rows of every failing test, queryable in the audit schema.
    +store_failures: true
    +schema: audit

models:
  credit_risk:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      +grants:
        select: ["analytics_reader"]

seeds:
  credit_risk:
    +schema: staging
