name: credit_risk
version: "0.1.0"
config-version: 2
profile: credit_risk

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Default: 90+ days past due within the first 12 installments.
  pd_window_installments: 12
  pd_default_dpd: 90
  # Qualifying rate for reference_installment_to_income_ratio: affordability at a fixed monthly rate, so the
  # feature does not carry the bank's own risk-based price. 3% >= every payroll and vehicle contract rate
  # and equals the personal-loan floor (portfolio median 3.45%).
  reference_rate_monthly: 0.03
  # Open Finance history shared at onboarding; anything on/after the application date is leakage.
  open_finance_history_days: 90

  # Data-quality budgets (percent of rows). Above *_warn the build warns; above *_error it fails.
  dq_unknown_customer_warn_pct: 2      # ~2x the observed rate (0.99%)
  dq_unknown_customer_error_pct: 5
  dq_incomplete_window_warn_pct: 15    # expected ~11% with DIRTY_RATE 0.01 (1 - 0.99^12)
  dq_incomplete_window_error_pct: 30
  dq_quarantine_warn_pct: 5
  dq_quarantine_error_pct: 10

data_tests:
  credit_risk:
    # Only the data-quality budget tests set store_failures: their offending rows are the ones worth
    # inspecting. Set globally, it left about a hundred empty tables in audit.
    +schema: audit

models:
  credit_risk:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      +grants:
        select: ["analytics_reader"]

seeds:
  credit_risk:
    +schema: staging
