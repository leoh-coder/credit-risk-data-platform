name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ingestion/requirements.txt
            ingestion/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Pytest
        run: python -m pytest -q

  compose-smoke:
    name: Compose smoke run (3-day backfill)
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      START: "2026-01-01"
      END: "2026-01-03"
      AS_OF: "2026-10-15"
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from template
        run: cp .env.example .env

      - name: Start lake + warehouse
        run: docker compose up -d --wait --wait-timeout 180

      - name: Backfill ${{ env.START }} .. ${{ env.END }}
        run: docker compose run --rm --build ingestion backfill --start "$START" --end "$END" --as-of "$AS_OF"

      - name: Assert lake contents
        run: >-
          docker compose run --rm -T --entrypoint python ingestion - "$START" "$END"
          < .github/scripts/lake_smoke_check.py

      - name: Assert warehouse schemas
        run: |
          schemas=$(docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA' <<'SQL'
          select count(*) from information_schema.schemata
          where schema_name in ('raw', 'staging', 'intermediate', 'marts', 'audit');
          SQL
          )
          echo "layer schemas found: $schemas"
          test "$schemas" -eq 5

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose --profile jobs down -v
