name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint + tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [ingestion, loader]
    # Loader integration tests need a real Postgres; its conftest fails (never skips) when CI is set.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: credit_risk_dw
          POSTGRES_USER: dw_admin
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dw_admin -d credit_risk_dw"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      LOADER_TEST_PG_DSN: host=localhost port=5432 dbname=credit_risk_dw user=dw_admin password=ci_only_password
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ingestion/requirements*.txt
            loader/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Pytest
        run: python -m pytest -q

  compose-smoke:
    name: Compose smoke run (3-day backfill + load)
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      START: "2026-01-01"
      END: "2026-01-03"
      AS_OF: "2026-10-15"
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from template
        run: cp .env.example .env

      - name: Start lake + warehouse
        run: docker compose up -d --wait --wait-timeout 180

      - name: Backfill ${{ env.START }} .. ${{ env.END }}
        run: docker compose run --rm --build ingestion backfill --start "$START" --end "$END" --as-of "$AS_OF"

      - name: Assert lake contents
        run: >-
          docker compose run --rm -T --entrypoint python ingestion - "$START" "$END"
          < .github/scripts/lake_smoke_check.py

      - name: Assert warehouse schemas
        run: |
          schemas=$(docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA' <<'SQL'
          select count(*) from information_schema.schemata
          where schema_name in ('raw', 'staging', 'intermediate', 'marts', 'audit');
          SQL
          )
          echo "layer schemas found: $schemas"
          test "$schemas" -eq 5

      - name: Load lake into Postgres raw
        run: docker compose run --rm --build loader run

      - name: Assert raw layer and audit
        run: |
          summary=$(docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -F " "' <<'SQL'
          select
            (select count(*) from audit.lake_loads),
            (select count(distinct _reference_date) from raw.customers),
            (select sum((rows_loaded ->> 'transactions')::int) from audit.lake_loads)
              = (select count(*) from raw.transactions);
          SQL
          )
          echo "audit loads, raw dates, audit matches raw: $summary"
          test "$summary" = "3 3 t"

      - name: Second load is a no-op (incremental)
        run: |
          docker compose run --rm loader run 2>&1 | tee load2.log
          grep -q "done: 0 loaded, 3 already up to date, 0 failed" load2.log

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose --profile jobs down -v
