name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint + tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [ingestion, loader, ml, dashboard]
    # Loader integration tests need a real Postgres; its conftest fails (never skips) when CI is set.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: credit_risk_dw
          POSTGRES_USER: dw_admin
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dw_admin -d credit_risk_dw"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      LOADER_TEST_PG_DSN: host=localhost port=5432 dbname=credit_risk_dw user=dw_admin password=ci_only_password
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ingestion/requirements*.txt
            loader/requirements*.txt
            ml/requirements*.txt
            dashboard/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Pytest
        run: python -m pytest -q

  compose-smoke:
    name: Compose smoke run (backfill, load, dbt build, freshness, docs, roles, dashboard)
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      START: "2026-01-01"
      END: "2026-01-03"
      AS_OF: "2026-10-15"
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from template
        run: cp .env.example .env

      - name: Start lake + warehouse
        run: docker compose up -d --wait --wait-timeout 180

      - name: Backfill ${{ env.START }} .. ${{ env.END }}
        run: docker compose run --rm --build ingestion backfill --start "$START" --end "$END" --as-of "$AS_OF"

      - name: Assert lake contents
        run: >-
          docker compose run --rm -T --entrypoint python ingestion - "$START" "$END"
          < .github/scripts/lake_smoke_check.py

      - name: Assert warehouse schemas
        run: |
          schemas=$(docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA' <<'SQL'
          select count(*) from information_schema.schemata
          where schema_name in ('raw', 'staging', 'intermediate', 'marts', 'audit');
          SQL
          )
          echo "layer schemas found: $schemas"
          test "$schemas" -eq 5

      - name: Load lake into Postgres raw
        run: docker compose run --rm --build loader run

      - name: Assert raw layer and audit
        run: |
          summary=$(docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -F " "' <<'SQL'
          select
            (select count(*) from audit.lake_loads),
            (select count(distinct _reference_date) from raw.customers),
            (select sum((rows_loaded ->> 'transactions')::int) from audit.lake_loads)
              = (select count(*) from raw.transactions);
          SQL
          )
          echo "audit loads, raw dates, audit matches raw: $summary"
          test "$summary" = "3 3 t"

      - name: Second load is a no-op (incremental)
        run: |
          docker compose run --rm loader run 2>&1 | tee load2.log
          grep -q "done: 0 loaded, 3 already up to date, 0 failed" load2.log

      - name: Transform with dbt (models, unit tests, data tests, contracts)
        run: docker compose run --rm --build dbt build

      - name: Source freshness
        run: docker compose run --rm dbt source freshness

      - name: Generate dbt docs (single static HTML)
        run: |
          docker compose run --name dbt-docs-gen dbt docs generate --static
          docker cp dbt-docs-gen:/app/credit_risk/target/static_index.html ./dbt-docs.html
          docker rm dbt-docs-gen

      - name: Upload dbt docs
        uses: actions/upload-artifact@v7
        with:
          name: dbt-docs
          path: dbt-docs.html
          if-no-files-found: error

      - name: Assert marts are the only layer analytics_reader can read
        run: |
          result=$(docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -F " "' <<'SQL'
          select
            has_table_privilege('analytics_reader', 'marts.fct_credit_operations', 'SELECT'),
            has_schema_privilege('analytics_reader', 'staging', 'USAGE'),
            has_schema_privilege('analytics_reader', 'raw', 'USAGE');
          SQL
          )
          echo "reads marts, uses staging, uses raw: $result"
          test "$result" = "t f f"

      - name: Assert read-only login roles (ml_reader, dashboard_reader)
        run: |
          result=$(docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -F " "' <<'SQL'
          select
            (select count(*) from pg_roles where rolname in ('ml_reader', 'dashboard_reader') and rolcanlogin),
            pg_has_role('ml_reader', 'analytics_reader', 'MEMBER'),
            pg_has_role('dashboard_reader', 'analytics_reader', 'MEMBER'),
            has_schema_privilege('dashboard_reader', 'raw', 'USAGE'),
            has_schema_privilege('ml_reader', 'audit', 'USAGE');
          SQL
          )
          echo "login roles, ml member, dashboard member, dashboard uses raw, ml uses audit: $result"
          test "$result" = "2 t t f f"

      # The model is not trained here: 3 days of contracts have no mature cohort to learn from.
      - name: Build the ml image
        run: docker compose build ml

      - name: Every dashboard query runs against the marts as dashboard_reader
        run: |
          docker compose --profile app run --rm -T dashboard python - <<'PY'
          from dashboard.config import get_settings
          from dashboard.queries import QUERIES, fetch
          for name in QUERIES:
              frame = fetch(name, get_settings().database_url)
              print(f"{name}: {len(frame)} rows")
          PY

      - name: Dashboard container becomes healthy
        run: |
          docker compose --profile app up -d --wait --wait-timeout 120 dashboard
          curl -fsS http://localhost:8501/_stcore/health

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose --profile jobs --profile app down -v
